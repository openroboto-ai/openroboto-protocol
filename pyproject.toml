[project]
name = "openroboto-protocol"
# The version number **is** the contract version (README, "Versioning is a promise"),
# and consumers pin it exactly: `openroboto-protocol==0.12.0`. README and AGENTS.md
# must be edited with it — `tests/test_version.py` guards both directions (pins agree
# + 0.x must state that compatibility is not promised), and
# `test_quoted_pin_examples_do_not_drift` scans this line too, so this example cannot
# fall five versions behind the way it did at 0.2.0.
#
# **Still 0.x because nobody has called 1.0.0 yet.** As of 0.11.0 all four
# preconditions in the AGENTS.md §1② checklist are ticked, so releasing 1.0.0 is a
# decision the owner makes, not a blocked one. Until it is made, compatibility is
# not promised, and tightening a sentinel default in schemas the way 0.1.0 → 0.2.0
# did stays allowed.
#
# ⚠️ 0.1.0 is already on PyPI (2026-08-19, OIDC). PyPI version numbers cannot be
# reused; the only direction is forward.
version = "0.12.0"
description = "Shared protocol contract for the OpenRoboto subnet on Bittensor (netuid 80): seed derivation, commitment codec, model hashing, status vocabulary and API schemas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenRoboto", email = "cameron@moonshotcommons.com" }]
keywords = ["bittensor", "openroboto", "subnet", "protocol"]

# ⚠️ 3.11, not the 3.12 that `uv init` defaults to. The miner side runs 3.11
# (openroboto-subnet's Dockerfile and SETUP_NATIVE.md both hardcode python3.11,
#  openroboto-evaluation is >=3.11). Writing 3.12 means no miner can install this.
# The backend is on 3.12, which is covered.
requires-python = ">=3.11"

# Keep zero runtime dependencies. This package is installed into miner and evaluator
# environments; every dependency is one more chance of a version conflict. If one is
# really needed (schemas.py wanting pydantic, say), discuss it separately.
dependencies = []

classifiers = [
    # This is the line miners read on the PyPI page, and it must tell the same story
    # as the version number: while the package is 0.x, README and AGENTS.md say
    # compatibility is not promised, so a "Production/Stable" badge would contradict
    # them. It moves to "5 - Production/Stable" together with 1.0.0, not before.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/openroboto-ai/openroboto-protocol"
Issues = "https://github.com/openroboto-ai/openroboto-protocol/issues"
# Consumers pin exact versions, so "does this release require anything of me" is
# their first question. The CHANGELOG does not ship inside the package (sdist and
# wheel carry only the README), so this sidebar link on PyPI is its only entrance.
Changelog = "https://github.com/openroboto-ai/openroboto-protocol/blob/main/CHANGELOG.md"

# `schemas.py` is the only module needing pydantic, so it goes behind an optional
# dependency and the main `dependencies` stays empty.
#
# Why not in the main `dependencies`: a miner installs this package only to derive a
# seed and decode a commitment (`seed.py` / `commitment.py` / `model_hash.py`, three
# pure-function modules), and should not be forced to build a pydantic-core wheel on
# a GPU box. `__init__.py` re-exports nothing, so `import openroboto_protocol` never
# triggers `import pydantic` — that is what makes the zero-dependency promise hold,
# rather than good intentions
# (`tests/test_schemas.py::test_miner_facing_imports_do_not_require_pydantic` pins it).
#
# Why schemas is worth pydantic (instead of staying on stdlib dataclasses): the
# backend is FastAPI, and the dataclass version has a **measured ceiling** — a
# violation can only be caught in `__post_init__`, by which point the framework has
# already coerced the JSON value once. Real pydantic models can carry `StrictBool` /
# `StrictInt`, which makes "a bool posing as a number" unrepresentable at the **model
# layer** (production's first check in `_validate_env_scores`; the historical cost
# was `samples=-5` taking the crown) instead of relying on every caller remembering
# to validate by hand first.
#
# Consumer: `openroboto-backend` installs `openroboto-protocol[schemas]`.
[project.optional-dependencies]
schemas = ["pydantic>=2.9,<3"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.4.3,<10.0.0",
    "coverage>=7.4.3,<8.0.0",
    "mypy>=1.8.0,<3.0.0",
    "ruff>=0.2.2,<1.0.0",
    # The dev environment installs the optional dependency so that
    # tests/test_schemas.py runs and mypy can see schemas.py locally. This does not
    # change the main `dependencies`.
    "openroboto-protocol[schemas]",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "RUF"]
# Comments and docstrings in this repo are English (AGENTS.md §4 — it is a public
# package, its readers are not on the team). What is left in CJK is deliberate test
# data and quoted incident material: the round-trip case in tests/test_commitment.py
# encodes a non-ASCII repo id on purpose, and tests/test_schemas.py quotes the
# 2026-08-14 incident wording. CJK punctuation trips RUF001-003, which exist to catch
# homoglyph attacks and are pure noise here. Only those three are off; the rest of RUF
# stays on.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.coverage.report]
# Red-line territory. Every line here decides whether a historical evaluation
# reproduces; no gaps are left.
fail_under = 100
show_missing = true
