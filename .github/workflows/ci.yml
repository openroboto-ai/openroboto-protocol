name: CI

# Single branch: main is the only long-lived branch and features go through PRs.
# Direct pushes to main run this too — triggering on PRs alone would let a direct
# push through without a single check.
#
# Tags do **not** trigger here; release.yml pulls this in with workflow_call,
# because publishing must wait for these gates and `needs:` cannot cross workflows.
# Triggering on tags in both places would run the whole suite twice for one tag,
# and nobody would look at one of the two results.
#
# workflow_call means this file is the **only** definition of the gates. No
# "release-specific" checklist may be copied into release.yml: the copy would only
# ever be the weaker one, and nobody maintains two.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One version number shared by all three jobs — written separately, one of them
  # eventually gets missed and two jobs in the same run resolve different dependency
  # trees. Before bumping it, confirm astral-sh/setup-uv knows its checksum:
  # https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
  UV_VERSION: "0.11.18"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Golden vectors get their own job, and the job name is its meaning.
  #
  # A red anywhere else means "the code is wrong". A red here means **somebody
  # changed history that already happened on chain** — history that decided who got
  # emissions. The two are handled completely differently (fix the code vs. stop and
  # explain why the past needs rewriting), so they must be told apart at a glance in
  # the PR check list and not buried inside "tests" as one more case.
  #
  # Runs on .python-version (3.11) because that is what the miner side runs — the
  # interpreter that reproduces history should be the one that produced it.
  # ───────────────────────────────────────────────────────────────────────────
  golden-vectors:
    name: golden vectors (RED = on-chain history was rewritten)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # --locked: fail on the spot when dependencies changed without uv.lock being
      # updated, instead of letting CI quietly re-resolve — that would install
      # something other than what the release machine installs.
      - run: uv sync --locked

      # A glob rather than a list of filenames: a new test_*golden_vectors.py is
      # picked up automatically. And if somebody renames a file out of that
      # convention the glob matches nothing and pytest reports a usage error — an
      # explicit failure, not a silent skip. Likewise, emptying GOLDEN_SEEDS makes
      # pytest exit 5 ("no tests collected"), which is also red. This job has no path
      # to going green on nothing.
      - name: Golden vectors
        run: uv run pytest tests/test_*golden_vectors.py -q

  # ───────────────────────────────────────────────────────────────────────────
  # Both 3.11 and 3.12 must pass: miners and the evaluation machine are on 3.11
  # (openroboto-subnet's Dockerfile hardcodes python3.11), the backend is on 3.12.
  # This package is installed into both, and verifying only one side leaves the
  # compatibility problem for a miner to discover at install time.
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One side failing must not hide the other's result — we need to know whether
      # both are broken or only one.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # UV_PYTHON outranks .python-version, so uv manages the interpreter itself and
      # setup-python is not used — otherwise setup-python installs 3.12, uv reads
      # .python-version and downloads 3.11, and the matrix means nothing.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # --locked: fail on the spot when dependencies changed without uv.lock being
      # updated, instead of letting CI quietly re-resolve — that would install
      # something other than what the release machine installs.
      - run: uv sync --locked

      # Call the script instead of spelling out three commands here: local
      # `bash scripts/lint.sh` and what CI runs must be the same file, or sooner or
      # later you get "green locally, red in CI" — or worse, a CI copy that is
      # quietly weaker. The script says which tool covers which part.
      - name: Lint
        run: bash scripts/lint.sh

      # --source=src is not optional: without it coverage also measures pytest
      # itself, the denominator inflates and the 100% gate stops meaning anything.
      - name: Test
        run: uv run coverage run --source=src -m pytest -q

      # 100%, not 90%. The package is a few hundred lines and every one of them
      # decides whether a historical evaluation reproduces, whether a payment counts,
      # or who gets emissions — there is no "this part does not matter" line.
      # pyproject also sets fail_under=100; stating it again here keeps CI from
      # staying green after somebody quietly lowers the config.
      - name: Coverage gate
        run: uv run coverage report --fail-under=100

  # ───────────────────────────────────────────────────────────────────────────
  # The last gate before publishing: can a package be built, and is it still whole
  # once installed. It runs on every PR, not only on tags — broken packaging should
  # be known before the merge, not at the moment 1.0.0 goes out.
  #
  # There is still **no** uv publish here: publishing needs `id-token: write` and an
  # environment with human approval, and this job runs on every PR. Putting the
  # release here would mean somebody approving every PR, with PR-branch code holding
  # OIDC permissions. Publishing lives in release.yml, which `uses:` this file as its
  # gates and then downloads the dist this job uploaded — **what ships is the exact
  # artifact verified here**, not a second build of it.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: build (packaging gate; publish lives in release.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ci, golden-vectors]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # The version number is the contract version. A tag disagreeing with pyproject
      # means a consumer pinning `openroboto-protocol==1.0.0` installs something
      # else — which voids this package's only reason to exist (that both sides can
      # be proven to have installed the same thing).
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} != pyproject version ${version}"
            exit 1
          fi
          echo "tag v${tag} matches pyproject version"

      - run: uv build

      # PyPI rejects bad metadata **at upload time** (most often a README that will
      # not render). By then the tag is pushed, and the only way out is a new version
      # number — and the version number is the contract version, so burning one over
      # a formatting problem is not a small thing. twine check moves that judgement
      # forward to the PR.
      # uvx: a one-shot tool, kept out of the dev group so neither miner nor CI
      # environments pay for it.
      - name: Metadata is uploadable
        run: uvx twine check --strict dist/*

      # The zero-dependency promise is written in the wheel's METADATA, so it is
      # checked there rather than trusted. A dependency carrying an `extra ==` marker
      # is fine — the consumer opted into it (only `openroboto-protocol[schemas]`
      # pulls pydantic). One **without** a marker is forced onto every miner GPU box,
      # which is miners paying for our convenience.
      - name: Wheel declares no unconditional dependencies
        run: |
          meta="$(unzip -p dist/*.whl '*.dist-info/METADATA')"
          unconditional="$(printf '%s\n' "$meta" \
            | grep '^Requires-Dist:' | grep -v 'extra ==' || true)"
          if [ -n "$unconditional" ]; then
            echo "::error::wheel declares unconditional runtime dependencies:"
            echo "$unconditional"
            exit 1
          fi
          printf '%s\n' "$meta" | grep -E '^(Requires-Dist|Provides-Extra):' || echo "no dependencies at all"

      # Install the built wheel and check again. Two things are only visible after
      # installing:
      #   1. whether py.typed made it into the package — without it a consumer's mypy
      #      treats this package as Any, silently, and "consumers' mypy sees the real
      #      types" is one of the main reasons to publish it;
      #   2. whether a module missed the wheel — every module in the package is
      #      imported in turn, so a new module is covered without editing this step.
      # extras are read from METADATA rather than hardcoded: installing all extras is
      # what makes the modules needing an optional dependency importable (today,
      # schemas needs pydantic), and renaming or adding an extra does not touch this.
      - name: Smoke test the built wheel
        run: |
          wheel="$(ls dist/*.whl)"
          extras="$(unzip -p "$wheel" '*.dist-info/METADATA' \
            | sed -n 's/^Provides-Extra: //p' | paste -sd, -)"
          # An if, not `[ -n .. ] && ..`: GitHub's default shell is `bash -e`, and
          # with empty extras that form returns 1 for the whole statement, failing
          # this step outright.
          if [ -n "$extras" ]; then
            wheel="${wheel}[${extras}]"
          fi
          echo "installing ${wheel}"
          uv run --isolated --no-project --with "$wheel" python - <<'PY'
          import importlib
          import pathlib
          import pkgutil

          import openroboto_protocol

          root = pathlib.Path(openroboto_protocol.__path__[0])
          modules = [m.name for m in pkgutil.iter_modules(openroboto_protocol.__path__)]
          assert modules, f"wheel shipped no modules: {root}"
          for name in modules:
              importlib.import_module(f"openroboto_protocol.{name}")

          assert (root / "py.typed").is_file(), (
              "py.typed missing from the wheel — consumers' mypy would silently "
              "treat this package as Any"
          )
          print(f"wheel ok: {len(modules)} modules + py.typed")
          PY

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          # The default is 90 days. GitHub Free gives Actions 500 MB of storage, and
          # long-retained artifacts quietly eat the quota and then start billing.
          retention-days: 7
