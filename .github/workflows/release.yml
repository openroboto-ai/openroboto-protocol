name: Release

# ═══════════════════════════════════════════════════════════════════════════════
# What it costs when this package cannot be published (written here because whoever
# edits this file needs to know what they are taking apart)
#
# openroboto-protocol is the single source of truth for the red-line area: seed
# derivation, model fingerprint, status vocabulary, response envelopes. If it cannot
# be installed, consumers can only copy it. openroboto-backend used to carry three
# hand-copied mirrors — app/domain/worker_reports.py · app/domain/reasons.py · the
# copied block in app/api/envelope.py — guarded only by anti-drift tests, while the
# backend's "Protocol version is pinned" check ran on nothing, because the package
# was not in the dependency table at all.
#
# That path was closed on 2026-08-19/20: all three mirrors became imports, both
# consumer repos install from PyPI pinned to an exact version (backend 0.10.0 / CLI
# 0.9.0), and both "No vendored protocol copy" and "Protocol version is pinned" now
# run against something real. **This workflow is the precondition for that** — stop
# it and consumers are back to copying.
#
# "Hand-copied files drift" is not hypothetical: protocol/types.py drifted 105 lines
# and payment.py 313, so miners encoded by A while the backend decoded by B, **with
# no error on either side**, until somebody went looking for why one evaluation
# would not reproduce. Publishing is what closes that path for good.
# ═══════════════════════════════════════════════════════════════════════════════

# A **real release** only happens on a v* tag: the input to a release must be an
# immutable git reference, and it is the same number consumers pin with `==`.
#
# `workflow_dispatch` only takes the TestPyPI branch (see the comments on
# `publish-testpypi`); a manual trigger can **never** reach real PyPI — the `if` on
# the `publish` job below nails that down.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Publish to TestPyPI (not real PyPI). Type testpypi to confirm'
        required: true
        default: ''
        type: string

# Minimal by default; the publish job adds id-token for itself where needed.
permissions:
  contents: read

# cancel-in-progress: false — the opposite of ci.yml, deliberately. Uploading to
# PyPI cannot be undone or replayed (a version number uploads exactly once), and
# being cut off halfway by a later workflow leaves a half-published version, which is
# much worse than being slow.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same version as ci.yml. Before bumping it, confirm astral-sh/setup-uv knows its
  # checksum:
  # https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
  UV_VERSION: "0.11.18"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The gates before a release are exactly the ones a PR runs, line for line — it
  # `uses` ci.yml instead of restating a few "release checks" here. A restatement is
  # necessarily the weaker one (who would retype the 3.11/3.12 matrix and the 100%
  # coverage gate inside a release workflow), and nobody remembers to maintain two.
  #
  # What that guarantees (all in ci.yml; red means it does not ship):
  #   · golden vectors — on-chain history was not rewritten
  #   · lint + mypy strict + pytest + coverage 100% (once on 3.11, once on 3.12)
  #   · tag agrees with the pyproject version ("Tag matches package version" in the
  #     build job)
  #   · twine check, no unconditional dependencies in the wheel, every module imports
  #     once installed, py.typed is in the package
  # ───────────────────────────────────────────────────────────────────────────
  gates:
    name: gates (the same ones every PR runs)
    uses: ./.github/workflows/ci.yml

  # ───────────────────────────────────────────────────────────────────────────
  # PyPI Trusted Publishing (OIDC), no API token.
  #
  # Same reasoning as the backend using Workload Identity Federation: a long-lived
  # token sitting in repo secrets cannot be audited afterwards — who saw it, when it
  # leaked, what was published with it. And that token's power is "publish any
  # version to PyPI as OpenRoboto", so whoever holds it can push every miner a 1.0.1
  # with altered seed derivation. An OIDC token is valid for one workflow run, and
  # PyPI additionally requires it to come from a named repo + workflow file +
  # environment, so there is nothing in the repository worth stealing.
  #
  # On TestPyPI: the package itself does not need it. Metadata is judged by
  # `twine check --strict`, and packaging integrity by installing the wheel,
  # importing every module and checking py.typed.
  #
  # What the gates cannot verify is the **publishing channel itself**: whether the
  # OIDC exchange succeeds, whether the environment name matches the record on
  # pypi.org, whether `id-token: write` is enough. None of that runs before a real
  # `uv publish`. Hence the `workflow_dispatch` TestPyPI branch, which runs the
  # **same gates on the same artifact** and only changes the upload target.
  #
  # To keep the two from drifting, both jobs share `needs: [gates]` and the same
  # artifact; the only difference is the environment name and the `--publish-url`
  # line.
  #
  # ⚠️ TestPyPI version numbers are **equally unreusable**. It is not a sandbox to
  # publish into freely, only a place where a mistake does not reach real consumers.
  #
  # The real safety net is still the human approval on the environment below — a
  # version number cannot be spent twice.
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: publish to PyPI
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 🔴 A manual trigger can **never** reach real PyPI. Without this line a
    # `workflow_dispatch` would light up both publish jobs, and that one cannot be
    # undone.
    if: startsWith(github.ref, 'refs/tags/v')

    # The environment does two things, both required:
    #   1. GitHub can require reviewers on it — the upload cannot be undone and the
    #      version number cannot be reused, so a human must confirm this is the tag
    #      to publish before it goes;
    #   2. PyPI's trusted publisher configuration names this environment, and a
    #      mismatch makes the OIDC exchange fail outright. Renaming it means
    #      changing that record on pypi.org at the same time.
    environment:
      name: pypi
      url: https://pypi.org/p/openroboto-protocol

    permissions:
      # Required for OIDC: without it uv cannot get an id token and trusted
      # publishing is impossible.
      id-token: write
      contents: read

    steps:
      # No checkout: what ships is the artifact built and verified by the gates, not
      # a second build of it. Skipping the checkout also means this job, which holds
      # the id token, has no repository code to execute — the only thing running is
      # uv publish.
      - name: Download the artifact that passed the gates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # ci.yml already compared the tag against pyproject's version. This compares
      # the **artifact filenames**, i.e. the bytes about to be uploaded. The first
      # proved "the source says 1.0.0"; this proves "the package about to ship is
      # really called 1.0.0". An artifact upload and download sit between the two,
      # and consumers pin the version number: `openroboto-protocol==1.0.0` resolving
      # to something else voids this package's only reason to exist.
      - name: Artifact version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for expected in \
            "dist/openroboto_protocol-${version}.tar.gz" \
            "dist/openroboto_protocol-${version}-py3-none-any.whl"; do
            if [ ! -f "$expected" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} but no ${expected}; dist holds:"
              ls -1 dist
              exit 1
            fi
          done
          echo "dist matches tag ${GITHUB_REF_NAME}"

      # --trusted-publishing always, not automatic. automatic **silently falls back**
      # to looking for a token or password when it cannot get an OIDC token, so a
      # misconfigured permission does not go red but turns into an unreadable 401.
      # always fails right here, with the error where the cause is.
      - name: Publish
        run: uv publish --trusted-publishing always dist/*

  # ───────────────────────────────────────────────────────────────────────────
  # TestPyPI — manual trigger only, to rehearse the publishing channel (not the
  # package itself; that is what the gates are for).
  #
  # It differs from the job above by two lines: the environment name and
  # `--publish-url`. Everything else is shared: the same `needs: [gates]`, the same
  # artifact, the same `--trusted-publishing always`. **It deliberately has no gates
  # of its own** — with two sets of gates, only one of them stays correct.
  #
  # test.pypi.org needs its own pending publisher, four fields:
  #   Owner=openroboto-ai  Repository=openroboto-protocol
  #   Workflow=release.yml  Environment=testpypi
  # The first two match the real record; the environment **must** differ, or PyPI
  # cannot tell the two records apart.
  # ───────────────────────────────────────────────────────────────────────────
  publish-testpypi:
    name: publish to TestPyPI (rehearsal)
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Manual trigger only, and it has to be typed into the confirmation box — this
    # guards against opening "Run workflow" and hitting enter out of habit.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.confirm == 'testpypi'

    environment:
      name: testpypi
      url: https://test.pypi.org/p/openroboto-protocol

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download the artifact that passed the gates
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # A manual trigger has no tag to compare against, so this checks the **shape of
      # the artifact**: exactly one sdist and one wheel. A third file (a leftover from
      # an earlier build, say) would mean uploading more than the bytes these gates
      # verified.
      - name: Exactly one sdist and one wheel
        run: |
          ls -1 dist
          test "$(ls -1 dist/*.tar.gz | wc -l)" -eq 1
          test "$(ls -1 dist/*.whl | wc -l)" -eq 1

      - name: Publish to TestPyPI
        run: |
          uv publish --trusted-publishing always \
            --publish-url https://test.pypi.org/legacy/ dist/*
