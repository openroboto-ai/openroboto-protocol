# The first net before a commit. Same origin as openroboto-backend's file of the
# same name, minus its frontend and `.trellis/` parts — this repo has neither of
# those directories, so it needs no `exclude:`.
#
# Install once: `uvx pre-commit install`. Keeping it out of the dev group is
# deliberate — `[dependency-groups] dev` is installed on every CI runner, while
# pre-commit only means anything on a human's machine, so there is no reason to make
# every `uv sync --locked` download another dependency tree.
#
# What this cannot catch, CI does (100% coverage, golden vectors, py.typed in the
# wheel). And the other way round: skipping a hook locally does not let anything bad
# into main, it only costs you five minutes waiting on CI.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
      # A syntax error in pyproject.toml means the package will not build at all;
      # this catches it earlier than any test.
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      # This package should hold no secrets at all, but the repository is public and
      # one accidental `git add` is a permanent leak.
      - id: detect-private-key

  - repo: https://github.com/crate-ci/typos
    rev: bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # frozen: v1.48.0
    hooks:
      - id: typos
        args: [--force-exclude]

  - repo: local
    hooks:
      # language: system + `uv run`: use the ruff / mypy from the repo venv, the same
      # binary `scripts/lint.sh` and CI use. pre-commit's own
      # `repo: https://github.com/astral-sh/ruff-pre-commit` installs a second copy,
      # and then the hook is green while CI is red because the two ruff versions
      # differ.
      - id: local-ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: system
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        require_serial: true
        language: system
        types: [python]

      # pass_filenames: false — mypy strict needs the whole of src to infer; feeding
      # it only the changed files misses type errors at the call sites.
      - id: local-mypy
        name: mypy check
        entry: uv run mypy src
        require_serial: true
        language: system
        pass_filenames: false
